name: AI-QRS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compilation Check
        run: |
          python -m py_compile backend/main.py backend/api/routes/analytics.py backend/services/analytics_service.py agents/orchestrator.py

      - name: Run Milestone Test Suite (M2, M3, M4, Orchestrator)
        env:
          OPENROUTER_API_KEY: "mock-api-key-for-ci"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest tests/test_m4_milestone.py tests/test_m3_milestone.py tests/test_m2_milestone.py tests/test_orchestrator.py -v
